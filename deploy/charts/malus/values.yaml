global:
  appEnv: prod
  logLevel: info
  image:
    repository: ghcr.io/ryet7/malus-be
    separator: "-"
    tag: latest
    pullPolicy: IfNotPresent
  workloadIdentity: true
  env: {}

networkPolicy:
  enabled: true
  extraEgressPorts: []

migration:
  enabled: true
  service: content

defaults:
  port: 8080
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPU: 70

services:
  gateway:
    enabled: true
    allowIngressFrom: anywhere
    service:
      type: LoadBalancer
      externalTrafficPolicy: Local
    autoscaling:
      enabled: true
      maxReplicas: 3
    identityClientId: ""
    env:
      CONTENT_URL: http://content
      INTERACTION_URL: http://interaction
      REALTIME_URL: http://realtime
      TRUST_PROXY_HEADERS: "false"
    secretEnv: {}

  content:
    enabled: true
    allowIngressFrom: gateway
    service:
      type: ClusterIP
    identityClientId: ""
    env: {}
    secretEnv: {}

  interaction:
    enabled: true
    allowIngressFrom: gateway
    service:
      type: ClusterIP
    identityClientId: ""
    env: {}
    secretEnv: {}

  realtime:
    enabled: true
    allowIngressFrom: gateway
    service:
      type: ClusterIP
    autoscaling:
      enabled: true
      maxReplicas: 5
    identityClientId: ""
    env: {}
    secretEnv: {}

  worker:
    enabled: true
    service: null
    keda:
      enabled: false
      queueName: moderation
      namespace: ""
      maxReplicas: 2
    identityClientId: ""
    env: {}
    secretEnv: {}
