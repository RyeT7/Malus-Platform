{{- if .Values.migration.enabled }}
{{- $name := .Values.migration.service }}
{{- $svc := index .Values.services $name }}
{{- $cfg := include "malus.config" (dict "root" $ "svc" $svc) | fromYaml }}
{{- $ctx := dict "root" $ "name" $name "cfg" $cfg }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-migrate
  labels:
    {{- include "malus.labels" $ctx | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "malus.podLabels" $ctx | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      securityContext:
        {{- include "malus.podSecurityContext" $ctx | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "malus.image" $ctx }}
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "malus.env" $ctx | nindent 12 }}
          {{- include "malus.envFrom" $ctx | nindent 10 }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          securityContext:
            {{- include "malus.containerSecurityContext" $ctx | nindent 12 }}
{{- end }}
