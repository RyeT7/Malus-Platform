{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $cfg := include "malus.config" (dict "root" $ "svc" $svc) | fromYaml }}
{{- $ctx := dict "root" $ "name" $name "cfg" $cfg }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "malus.labels" $ctx | nindent 4 }}
spec:
  {{- if not $cfg.autoscaling.enabled }}
  replicas: {{ $cfg.replicas | int }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "malus.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "malus.podLabels" $ctx | nindent 8 }}
      annotations:
        checksum/env: {{ list $.Values.global.env $cfg.env $cfg.secretEnv | toJson | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        {{- include "malus.podSecurityContext" $ctx | nindent 8 }}
      containers:
        - name: app
          image: {{ include "malus.image" $ctx }}
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $cfg.port | int }}
          env:
            {{- include "malus.env" $ctx | nindent 12 }}
          {{- include "malus.envFrom" $ctx | nindent 10 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          securityContext:
            {{- include "malus.containerSecurityContext" $ctx | nindent 12 }}
{{- end }}
{{- end }}
