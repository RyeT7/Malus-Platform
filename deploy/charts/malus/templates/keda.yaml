{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.keda }}
{{- if $svc.keda.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ $name }}-servicebus
  labels:
    {{- include "malus.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  podIdentity:
    provider: azure-workload
    identityId: {{ $svc.identityClientId | quote }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}
  labels:
    {{- include "malus.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ $name }}
  minReplicaCount: 0
  maxReplicaCount: {{ $svc.keda.maxReplicas | int }}
  triggers:
    - type: azure-servicebus
      authenticationRef:
        name: {{ $name }}-servicebus
      metadata:
        queueName: {{ $svc.keda.queueName | quote }}
        namespace: {{ $svc.keda.namespace | quote }}
        messageCount: "5"
{{- end }}
{{- end }}
{{- end }}
