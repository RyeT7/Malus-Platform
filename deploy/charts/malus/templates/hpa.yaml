{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $cfg := include "malus.config" (dict "root" $ "svc" $svc) | fromYaml }}
{{- if $cfg.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "malus.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $cfg.autoscaling.minReplicas | int }}
  maxReplicas: {{ $cfg.autoscaling.maxReplicas | int }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cfg.autoscaling.targetCPU | int }}
{{- end }}
{{- end }}
{{- end }}
