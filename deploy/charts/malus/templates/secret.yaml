{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.secretEnv }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-env
  labels:
    {{- include "malus.labels" (dict "root" $ "name" $name) | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $svc.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
