{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "malus.labels" (dict "root" $ "name" $name) | nindent 4 }}
  {{- if and $.Values.global.workloadIdentity $svc.identityClientId }}
  annotations:
    azure.workload.identity/client-id: {{ $svc.identityClientId | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
