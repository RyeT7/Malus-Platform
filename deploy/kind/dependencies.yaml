apiVersion: v1
kind: Namespace
metadata:
  name: malus-deps
---
apiVersion: v1
kind: Secret
metadata:
  name: sqlserver
  namespace: malus-deps
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: Malus-local-Passw0rd
  SQLCMDPASSWORD: Malus-local-Passw0rd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: malus-deps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver
                  key: MSSQL_SA_PASSWORD
          ports:
            - containerPort: 1433
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q 'SELECT 1' -b -o /dev/null
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  namespace: malus-deps
spec:
  selector:
    app: sqlserver
  ports:
    - port: 1433
      targetPort: 1433
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sqlserver-init
  namespace: malus-deps
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mcr.microsoft.com/mssql/server:2022-latest
          command: ["/opt/mssql-tools18/bin/sqlcmd"]
          args:
            - -C
            - -S
            - sqlserver
            - -U
            - sa
            - -b
            - -Q
            - IF DB_ID('malus_content') IS NULL CREATE DATABASE malus_content
          env:
            - name: SQLCMDPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver
                  key: SQLCMDPASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosmos
  namespace: malus-deps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cosmos
  template:
    metadata:
      labels:
        app: cosmos
    spec:
      containers:
        - name: cosmos
          image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
          env:
            - name: PROTOCOL
              value: http
            - name: GATEWAY_PUBLIC_ENDPOINT
              value: cosmos.malus-deps.svc.cluster.local
            - name: ENABLE_EXPLORER
              value: "true"
            - name: ENABLE_TELEMETRY
              value: "false"
          ports:
            - name: gateway
              containerPort: 8081
            - name: explorer
              containerPort: 1234
          readinessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cosmos
  namespace: malus-deps
spec:
  selector:
    app: cosmos
  ports:
    - name: gateway
      port: 8081
      targetPort: 8081
    - name: explorer
      port: 1234
      targetPort: 1234
