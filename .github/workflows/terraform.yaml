name: terraform

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.12.2"
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - name: validate and test
        run: |
          for dir in bootstrap modules/container_app modules/aks_showcase stacks/core; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
          terraform -chdir=modules/container_app test
          terraform -chdir=stacks/core test -filter=tests/core.tftest.hcl

  apply:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        env: [dev, prod]
    environment: ${{ matrix.env }}
    concurrency: terraform-${{ matrix.env }}
    defaults:
      run:
        working-directory: stacks/core
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config=env/${{ matrix.env }}.backend.hcl
      - run: terraform plan -input=false -var-file=env/${{ matrix.env }}.tfvars -out=tfplan
      - run: terraform apply -input=false tfplan
      - name: smoke test
        run: |
          url=$(terraform output -raw gateway_url)
          for path in /healthz /v1/questions; do
            echo "GET $url$path"
            curl -fsS --retry 40 --retry-delay 10 --retry-all-errors --max-time 30 "$url$path" > /dev/null
          done
