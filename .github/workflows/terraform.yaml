name: terraform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.12.2"
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - name: validate and test
        run: |
          for dir in bootstrap modules/container_app modules/aks_showcase stacks/core; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
          terraform -chdir=modules/container_app test
          terraform -chdir=stacks/core test -filter=tests/core.tftest.hcl

  plan:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stacks/core
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config=env/dev.backend.hcl
      - run: terraform plan -input=false -lock=false -no-color -var-file=env/dev.tfvars -out=tfplan
      - name: summary
        run: |
          {
            echo '### dev plan'
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        env: [dev, prod]
    environment: ${{ matrix.env }}
    concurrency: terraform-${{ matrix.env }}
    defaults:
      run:
        working-directory: stacks/core
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init -input=false -backend-config=env/${{ matrix.env }}.backend.hcl
      - run: terraform plan -input=false -var-file=env/${{ matrix.env }}.tfvars -out=tfplan
      - run: terraform apply -input=false tfplan
