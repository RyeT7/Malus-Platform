name: nightly

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  destroy-dev:
    runs-on: ubuntu-latest
    environment: dev
    concurrency: terraform-dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-init
        with:
          backend-config: env/dev.backend.hcl
      - name: destroy, retried once for the azurerm 5.8 Container Apps delete polling bug
        working-directory: stacks/core
        run: |
          terraform destroy -input=false -auto-approve -var-file=env/dev.tfvars ||
            terraform destroy -input=false -auto-approve -var-file=env/dev.tfvars

  cleanup-test:
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/remove-test-env
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
