name: nightly-destroy

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev]
    environment: ${{ matrix.env }}
    concurrency: terraform-${{ matrix.env }}
    defaults:
      run:
        working-directory: stacks/core
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - run: terraform init -input=false -backend-config=env/${{ matrix.env }}.backend.hcl
      - run: terraform destroy -input=false -auto-approve -var-file=env/${{ matrix.env }}.tfvars

  cleanup-test:
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: delete a leftover test environment
        run: |
          if [ "$(az group exists -n rg-malus-test)" = "true" ]; then
            az group delete -n rg-malus-test --yes
          fi
