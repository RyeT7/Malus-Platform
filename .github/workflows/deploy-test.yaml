name: deploy-test

on:
  pull_request:
    paths:
      - "stacks/**"
      - "modules/**"
      - ".github/workflows/deploy-test.yaml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  TF_VERSION: "1.12.2"
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TEST_RESOURCE_GROUP: rg-malus-test

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: dev
    defaults:
      run:
        working-directory: stacks/core
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: remove leftovers from an interrupted run
        run: |
          if [ "$(az group exists -n "$TEST_RESOURCE_GROUP")" = "true" ]; then
            az group delete -n "$TEST_RESOURCE_GROUP" --yes
          fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -backend=false -input=false
      - run: terraform test -filter=tests/deploy.tftest.hcl
      - name: remove leftovers if teardown failed
        if: always()
        run: |
          if [ "$(az group exists -n "$TEST_RESOURCE_GROUP")" = "true" ]; then
            az group delete -n "$TEST_RESOURCE_GROUP" --yes --no-wait
          fi
